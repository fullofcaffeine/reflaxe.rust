name: Repair Existing Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag to repair (for example v0.82.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  HAXE_VERSION: "4.3.7"

jobs:
  repair:
    name: Complete publication for an existing tag
    if: startsWith(inputs.tag, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout supplied tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Setup exact Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.14.0"

      - name: Materialize exact reviewed release repository
        env:
          REPAIR_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          source_commit="$(
            env -i \
              PATH="/usr/bin:/bin" \
              GIT_ATTR_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_NO_REPLACE_OBJECTS=1 \
              /usr/bin/git --no-replace-objects -C "$GITHUB_WORKSPACE" \
                rev-parse "$REPAIR_TAG^{commit}"
          )"
          bootstrap="$RUNNER_TEMP/exact-git-source.js"
          source_root="$RUNNER_TEMP/haxe-rust-release-source"
          env -i \
            PATH="/usr/bin:/bin" \
            GIT_ATTR_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_NO_REPLACE_OBJECTS=1 \
            /usr/bin/git --no-replace-objects cat-file blob \
              "$source_commit:scripts/release/exact-git-source.js" > "$bootstrap"
          node "$bootstrap" bootstrap "$GITHUB_WORKSPACE" "$source_commit" "$source_root"
          git -C "$source_root" remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          echo "RELEASE_BOOTSTRAP=$bootstrap" >> "$GITHUB_ENV"
          echo "RELEASE_SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "RELEASE_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Install locked npm dependencies
        run: |
          cd "$RELEASE_SOURCE_ROOT"
          env -u BASH_ENV -u ENV -u NODE_OPTIONS -u NODE_PATH \
            npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe 4.3.7
        run: |
          set -euo pipefail
          cd "$RELEASE_SOURCE_ROOT"
          env -u NODE_OPTIONS -u NODE_PATH node node_modules/lix/bin/lix.js download
          env -u NODE_OPTIONS -u NODE_PATH node node_modules/lix/bin/lix.js download haxe "${{ env.HAXE_VERSION }}"
          env -u NODE_OPTIONS -u NODE_PATH node node_modules/lix/bin/lix.js use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Resolve Rust toolchain policy
        id: rust-policy
        run: |
          cd "$RELEASE_SOURCE_ROOT"
          env -u NODE_OPTIONS -u NODE_PATH \
            node scripts/ci/rust-toolchain-policy.js --github-output --activate release

      - name: Setup reproducible release Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ steps.rust-policy.outputs.release }}

      - name: Repair only the supplied tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPAIR_TAG: ${{ inputs.tag }}
        run: |
          cd "$RELEASE_SOURCE_ROOT"
          env -u BASH_ENV -u ENV -u NODE_OPTIONS -u NODE_PATH \
            node "$RELEASE_BOOTSTRAP" assert "$RELEASE_SOURCE_ROOT" "$RELEASE_SOURCE_COMMIT"
          env -u BASH_ENV -u ENV -u NODE_OPTIONS -u NODE_PATH -u TAR_OPTIONS -u CARGO_BIN \
            -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY \
            -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_REPLACE_REF_BASE -u GIT_CONFIG_COUNT \
            GIT_ATTR_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            GIT_NO_REPLACE_OBJECTS=1 \
            node scripts/release/repair-release.js "$REPAIR_TAG"
